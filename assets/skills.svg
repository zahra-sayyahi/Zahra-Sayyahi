<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .arc-bg { fill:none; stroke:#1e1e2e; stroke-width:12; }
      .arc { fill:none; stroke-width:12; stroke-linecap:round; transform:rotate(-90deg); transform-box:fill-box; transform-origin:center; }

      @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .dial { animation: spinSlow 14s linear infinite; transform-box:fill-box; transform-origin:center; }
      .dial-r { animation-direction: reverse; animation-duration: 18s; }

      @keyframes glowText { 0%,100% { opacity:0.85; } 50% { opacity:1; } }
      .pct { animation: glowText 2.6s ease-in-out infinite; }

      @keyframes draw1 { 0% { stroke-dashoffset:439.8; } 55% { stroke-dashoffset:44; } 85% { stroke-dashoffset:44; } 100% { stroke-dashoffset:439.8; } }
      @keyframes draw2 { 0% { stroke-dashoffset:439.8; } 55% { stroke-dashoffset:88; } 85% { stroke-dashoffset:88; } 100% { stroke-dashoffset:439.8; } }
      @keyframes draw3 { 0% { stroke-dashoffset:439.8; } 55% { stroke-dashoffset:132; } 85% { stroke-dashoffset:132; } 100% { stroke-dashoffset:439.8; } }
      @keyframes draw4 { 0% { stroke-dashoffset:439.8; } 55% { stroke-dashoffset:66; } 85% { stroke-dashoffset:66; } 100% { stroke-dashoffset:439.8; } }
      .a1 { animation: draw1 15s ease-in-out infinite; animation-delay:0s; }
      .a2 { animation: draw2 15s ease-in-out infinite; animation-delay:0.3s; }
      .a3 { animation: draw3 15s ease-in-out infinite; animation-delay:0.6s; }
      .a4 { animation: draw4 15s ease-in-out infinite; animation-delay:0.9s; }
    </style>
  </defs>
  
  <text x="50" y="34" text-anchor="middle" fill="#e2e8f0" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700">Tech Stack</text>
  
  <!-- slot 1 -->
  <g>
    <circle class="dial" cx="130" cy="150" r="88" fill="none" stroke="#a855f7" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="4 6"/>
    <circle class="arc-bg" cx="130" cy="150" r="70"/>
    <circle class="arc a1" cx="130" cy="150" r="70" stroke="#a855f7" stroke-dasharray="439.8"/>
    <text x="130" y="146" text-anchor="middle" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="14" font-weight="700">Python</text>
    <text class="pct" x="130" y="164" text-anchor="middle" fill="#a855f7" font-family="'Fira Code', monospace" font-size="11">90%</text>
  </g>

  <!-- slot 2 -->
  <g>
    <circle class="dial dial-r" cx="340" cy="150" r="88" fill="none" stroke="#06b6d4" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="4 6"/>
    <circle class="arc-bg" cx="340" cy="150" r="70"/>
    <circle class="arc a2" cx="340" cy="150" r="70" stroke="#06b6d4" stroke-dasharray="439.8"/>
    <text x="340" y="146" text-anchor="middle" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="14" font-weight="700">TensorFlow</text>
    <text class="pct" x="340" y="164" text-anchor="middle" fill="#06b6d4" font-family="'Fira Code', monospace" font-size="11">80%</text>
  </g>

  <!-- slot 3 -->
  <g>
    <circle class="dial" cx="550" cy="150" r="88" fill="none" stroke="#f43f5e" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="4 6"/>
    <circle class="arc-bg" cx="550" cy="150" r="70"/>
    <circle class="arc a3" cx="550" cy="150" r="70" stroke="#f43f5e" stroke-dasharray="439.8"/>
    <text x="550" y="146" text-anchor="middle" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="14" font-weight="700">PyTorch</text>
    <text class="pct" x="550" y="164" text-anchor="middle" fill="#f43f5e" font-family="'Fira Code', monospace" font-size="11">70%</text>
  </g>

  <!-- slot 4 -->
  <g>
    <circle class="dial dial-r" cx="760" cy="150" r="88" fill="none" stroke="#a855f7" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="4 6"/>
    <circle class="arc-bg" cx="760" cy="150" r="70"/>
    <circle class="arc a4" cx="760" cy="150" r="70" stroke="#a855f7" stroke-dasharray="439.8"/>
    <text x="760" y="146" text-anchor="middle" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="14" font-weight="700">JS</text>
    <text class="pct" x="760" y="164" text-anchor="middle" fill="#a855f7" font-family="'Fira Code', monospace" font-size="11">85%</text>
  </g>
</svg>
