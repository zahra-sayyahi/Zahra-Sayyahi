<svg width="210" height="56" viewBox="0 0 210 56" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- گرادیانت متحرک -->
    <linearGradient id="emailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop class="c1" offset="0%" stop-color="#d93025"/>
      <stop class="c2" offset="50%" stop-color="#f43f5e"/>
      <stop class="c3" offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <style>
      /* انیمیشن گرادیانت */
      @keyframes shiftC1 { 0%,100% { stop-color:#d93025; } 50% { stop-color:#a855f7; } }
      @keyframes shiftC2 { 0%,100% { stop-color:#f43f5e; } 50% { stop-color:#d93025; } }
      @keyframes shiftC3 { 0%,100% { stop-color:#a855f7; } 50% { stop-color:#f43f5e; } }
      .c1 { animation: shiftC1 6s ease-in-out infinite; }
      .c2 { animation: shiftC2 6s ease-in-out infinite; }
      .c3 { animation: shiftC3 6s ease-in-out infinite; }

      /* انیمیشن هاور */
      .btn-group { cursor: pointer; }
      .btn-group:hover { transform: scale(1.05); transition: transform 0.3s ease; }
    </style>
  </defs>

  <g class="btn-group">
    <!-- بدنه اصلی دکمه -->
    <rect x="5" y="3" width="200" height="50" rx="25" ry="25"
          fill="url(#emailGrad)"/>

    <!-- آیکون Email -->
    <g transform="translate(20, 19)">
      <rect x="0" y="0" width="20" height="14" rx="2" fill="none" stroke="white" stroke-width="2"/>
      <polyline points="0,2 10,9 20,2" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- متن Email -->
    <text x="52" y="35" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="white">Email</text>
  </g>
</svg>