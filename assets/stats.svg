<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="clip1"><rect x="30" y="20" width="260" height="150" rx="20"/></clipPath>
    <clipPath id="clip2"><rect x="320" y="20" width="260" height="150" rx="20"/></clipPath>
    <clipPath id="clip3"><rect x="610" y="20" width="260" height="150" rx="20"/></clipPath>

    <linearGradient id="numGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="numGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="numGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <style>
      .card-bg { fill:#111118; }
      .card-border { fill:none; stroke-width:2; }
      @keyframes borderPulse { 0%,100% { stroke-opacity:0.45; } 50% { stroke-opacity:1; } }
      .b1 { stroke:#a855f7; animation: borderPulse 2.4s ease-in-out infinite; }
      .b2 { stroke:#06b6d4; animation: borderPulse 2.4s ease-in-out infinite 0.4s; }
      .b3 { stroke:#f43f5e; animation: borderPulse 2.4s ease-in-out infinite 0.8s; }

      @keyframes shimmer { 0% { transform: translateX(-320px); } 100% { transform: translateX(320px); } }
      .shine { animation: shimmer 3.2s linear infinite; }

      @keyframes riseIn { 0% { opacity:0; transform: translateY(10px); } 100% { opacity:1; transform: translateY(0); } }
      .num { animation: riseIn 0.9s ease-out both; }
      .num2 { animation-delay: 0.15s; }
      .num3 { animation-delay: 0.3s; }

      @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
      .icon { animation: bob 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    </style>
  </defs>

  <!-- card 1 -->
  <g>
    <rect class="card-bg" x="30" y="20" width="260" height="150" rx="20"/>
    <g clip-path="url(#clip1)">
      <rect class="shine" x="0" y="20" width="60" height="150" fill="#ffffff" opacity="0.05" transform="skewX(-20)"/>
    </g>
    <rect class="card-border b1" x="30" y="20" width="260" height="150" rx="20"/>
    <text class="icon" x="160" y="65" text-anchor="middle" font-size="26">📦</text>
    <text id="stat-repos" class="num" x="160" y="115" text-anchor="middle" font-size="40" font-weight="900" fill="url(#numGrad1)" font-family="'Segoe UI',Arial,sans-serif">27</text>
    <text x="160" y="145" text-anchor="middle" fill="#94a3b8" font-family="'Segoe UI',Arial,sans-serif" font-size="14">Repositories</text>
  </g>

  <!-- card 2 -->
  <g>
    <rect class="card-bg" x="320" y="20" width="260" height="150" rx="20"/>
    <g clip-path="url(#clip2)">
      <rect class="shine" x="290" y="20" width="60" height="150" fill="#ffffff" opacity="0.05" transform="skewX(-20)" style="animation-delay:0.6s;"/>
    </g>
    <rect class="card-border b2" x="320" y="20" width="260" height="150" rx="20"/>
    <text class="icon" x="450" y="65" text-anchor="middle" font-size="26" style="animation-delay:0.3s;">👥</text>
    <text id="stat-followers" class="num num2" x="450" y="115" text-anchor="middle" font-size="40" font-weight="900" fill="url(#numGrad2)" font-family="'Segoe UI',Arial,sans-serif">8</text>
    <text x="450" y="145" text-anchor="middle" fill="#94a3b8" font-family="'Segoe UI',Arial,sans-serif" font-size="14">Followers</text>
  </g>

  <!-- card 3 -->
  <g>
    <rect class="card-bg" x="610" y="20" width="260" height="150" rx="20"/>
    <g clip-path="url(#clip3)">
      <rect class="shine" x="580" y="20" width="60" height="150" fill="#ffffff" opacity="0.05" transform="skewX(-20)" style="animation-delay:1.2s;"/>
    </g>
    <rect class="card-border b3" x="610" y="20" width="260" height="150" rx="20"/>
    <text class="icon" x="740" y="65" text-anchor="middle" font-size="26" style="animation-delay:0.6s;">🔥</text>
    <text id="stat-contribs" class="num num3" x="740" y="115" text-anchor="middle" font-size="40" font-weight="900" fill="url(#numGrad3)" font-family="'Segoe UI',Arial,sans-serif">88</text>
    <text x="740" y="145" text-anchor="middle" fill="#94a3b8" font-family="'Segoe UI',Arial,sans-serif" font-size="14">Contributions</text>
  </g>
</svg>
